name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wittl
          POSTGRES_PASSWORD: wittl
          POSTGRES_DB: wittl
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wittl"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check . && ruff format --check .

      - name: Test
        working-directory: backend
        run: pytest --cov=app --cov-report=term-missing

      - name: Migrations apply cleanly to PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://wittl:wittl@localhost:5432/wittl
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: The schema and the migrations agree
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://wittl:wittl@localhost:5432/wittl
        # A model changed without a migration is a deploy that fails at 3am.
        run: |
          alembic revision --autogenerate -m "drift check" --rev-id drift_check
          if grep -qE '^\s+op\.(create|drop|alter|add)_' alembic/versions/drift_check_*.py; then
            echo "::error::Models have drifted from the migrations. Generate one and commit it."
            cat alembic/versions/drift_check_*.py
            exit 1
          fi
          rm alembic/versions/drift_check_*.py

      - name: The app starts and reports its capabilities
        working-directory: backend
        env:
          APP_MODE: demo
          DATABASE_URL: postgresql+psycopg://wittl:wittl@localhost:5432/wittl
          ADDRESS_PEPPER: ci-pepper-not-a-secret
          CORS_ALLOW_ORIGINS: http://localhost:5173
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/health && break; sleep 1; done
          body=$(curl -fsS http://127.0.0.1:8000/api/v1/health)
          echo "$body"
          echo "$body" | grep -q '"canSendRealMail":false'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci || npm install

      - name: The shared letter content is in sync
        run: node scripts/sync-content.mjs --check

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build for a project page
        working-directory: frontend
        env:
          VITE_BASE_PATH: /whyisthislighton/
        run: npm run build

      - name: Assets use the project base path
        working-directory: frontend
        run: |
          grep -q 'src="/whyisthislighton/assets/' dist/index.html
          echo "Base path applied correctly."

      - name: Build for a custom domain
        working-directory: frontend
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: No key-shaped strings in the bundle
        working-directory: frontend
        run: |
          ! grep -rEq 'sk_live_|sk_test_[A-Za-z0-9]{20}|whsec_[A-Za-z0-9]{20}' dist/

  parity:
    # The one test that must run with both languages present: the browser and
    # the server must compose byte-identical letters.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install
        run: |
          cd frontend && (npm ci || npm install)

      - name: Regenerate the fixtures from the TypeScript composer
        run: node scripts/gen-parity.mjs --check

      - name: The Python composer matches them
        working-directory: backend
        run: |
          pip install pytest
          # --noconftest: this job installs only pytest, but tests/conftest.py
          # imports the full app (pydantic, SQLAlchemy) at collection time and
          # its autouse DB fixture would run here too. test_parity.py needs
          # neither -- the composer is stdlib-only by design.
          pytest --noconftest tests/test_parity.py -v
