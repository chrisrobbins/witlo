[project]
name = "whyisthislighton-api"
version = "1.0.0"
description = "Composes, prices and mails friendly letters about outdoor lighting."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = [
  "S101",   # asserts are how the tests are written
  "B008",   # FastAPI's Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
